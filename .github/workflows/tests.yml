name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned test environment
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Validate bundled profiles
        run: PYTHONPATH=. python scripts/validate_model_profiles.py
      - name: Run complete regression suite
        run: PYTHONPATH=. pytest -q --cov=custom_components.govee_ble_air_purifier --cov-report=term-missing
      - name: Compile and check whitespace
        run: |
          python -m compileall -q custom_components tests
          git diff --check
